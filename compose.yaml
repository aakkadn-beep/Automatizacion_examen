# Dos contenedores:
#   app   → PHP + Apache con el prototipo (solo escucha dentro de la red de Docker)
#   caddy → recibe a los visitantes por los puertos 80 y 443, obtiene el certificado
#           HTTPS (Let's Encrypt) y le pasa las peticiones a app.
# Uso:  DOMINIO=edunex.midominio.com docker compose up -d --build
#       (sin dominio: DOMINIO=localhost → Caddy usa un certificado propio, no confiable)
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      EDUNEX_PROXIES: "172.28.0.10"        # solo se confía en Caddy para saber la IP real
    volumes:
      - datos:/var/www/edunex/datos        # los datos sobreviven aunque se reconstruya la imagen
    networks:
      interna: {}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: "${DOMINIO:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data                  # aquí guarda Caddy los certificados
    networks:
      interna:
        ipv4_address: 172.28.0.10
    depends_on:
      - app

networks:
  interna:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  datos:
  caddy_datos:
